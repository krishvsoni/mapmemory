services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mapmemory
      POSTGRES_PASSWORD: mapmemory
      POSTGRES_DB: mapmemory
    ports:
      - '5432:5432'
    volumes:
      - mapmemory_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  mapmemory_pg:
